<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <div class="info">
            <div class="info_0">
                <div class="apple">
                    <i class="ri-share-line share"></i>
                    <i class="ri-heart-3-line heart"></i>
                   <img src="./assets/apple-2.png" alt="apple">
                </div>
                <div class="apple_1">
                            
                            <div class="img" id="red">
                                <img src="./assets/apple-7.png" alt="apple">
                            </div>
                            <div class="img" id="green">
                                <img src="./assets/apple-3.png" alt="apple">
                            </div>
                            <div class="img" id="regee">
                                <img src="./assets/apple-7.png" alt="apple">
                            </div>
                            <div class="img" id="yellow">
                                <img src="./assets/apple-5.png" alt="apple">
                            </div>
                        </div>
                    </div>
                
           
            <div class="info_1">
                <h1>Delicious Apples</h1>
                <h2 class="code">code : 45888</h2>
                <h3>&#8377 100/kg</h3>
                <div class="colors">
                    <h2>Select a Color</h2>
                    <div class="images">
                        <div class="img" id="red">
                            <img src="./assets/apple-7.png" alt="apple">
                        </div>
                        <div class="img" id="green">
                            <img src="./assets/apple-6.png" alt="apple">
                        </div>
                        <div class="img" id="regee">
                            <img src="./assets/apple-7.png" alt="apple">
                        </div>
                        <div class="img" id="yellow">
                            <img src="./assets/apple-8.png" alt="apple">
                        </div>
                    </div>
                </div>

                <div class="benefits">
                    <h2>benefits</h2>
                    <ul>
                        <li>Apples are Nutritious</li>
                        <li>Apples may be good for weight loss</li>
                        <li>Apples may be good for bone health</li>
                        <li>They're linked to a lowest risk of diabetes</li>
                    </ul>
                </div>
                <button>Add to Card</button>
            </div>
        </div>
    </div>
  </body>
</html>

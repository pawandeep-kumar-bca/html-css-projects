<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon Page</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="coming_soon">
            <div class="cir"></div>
            <h1 class="h1">coming soon</h1>
            <p class="p">our new website is on its way! signup <br> to be notified when we launch.</p>
            <div class="timer">
                <div class="day">
                    <h1>23</h1>
                    <p>days</p>
                </div>
                <div class="day">
                    <h1>07</h1>
                    <p>hours</p>
                </div>
                <div class="day">
                    <h1>15</h1>
                    <p>minutes</p>
                </div>
                <div class="day">
                    <h1>42</h1>
                    <p>seconds</p>
                </div>

            </div>
            <div class="email">
                <input type="email" placeholder="Enter your email">
                <button>Notify me</button>
            </div>

            <div class="icons">
                <i class="ri-instagram-line"></i>
                <i class="ri-facebook-fill"></i>
                <i class="ri-twitter-fill"></i>
            </div>
        </div>
    </div>
</body>
</html>
